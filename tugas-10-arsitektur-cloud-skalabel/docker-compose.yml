version: "3.8"

services:
  app1:
    build: ./app
    environment:
      - INSTANCE_ID=app1
      - PORT=8000

  app2:
    build: ./app
    environment:
      - INSTANCE_ID=app2
      - PORT=8000

  app3:
    build: ./app
    environment:
      - INSTANCE_ID=app3
      - PORT=8000

  # TODO: jika kalian melakukan simulasi scale-up (langkah 5 di README),
  # tambahkan service "app4" di sini dengan pola yang sama, lalu tambahkan
  # "server app4:8000;" ke upstream block di nginx/nginx.conf.

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
